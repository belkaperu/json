name: diag2 (temporal)
on:
  push:
    branches: [arena/ff941121-json]
    paths: ['diag2.js']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - run: node diag2.js
      - run: |
          git config user.name "bot"; git config user.email "bot@agenda.com"
          git add diag2_resultado.json
          git commit -m "diag2 resultado" || exit 0
          git push

name: Diagnóstico de fuentes (temporal)

on:
  push:
    branches:
      - arena/ff941121-json
    paths:
      - 'diagnostico.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node diagnostico.js
      - name: Guardar resultado
        run: |
          git config --global user.name "Diagnostico Bot"
          git config --global user.email "bot@agenda.com"
          git add diagnostico_resultado.json
          git commit -m "Resultado del diagnóstico de fuentes" || exit 0
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}

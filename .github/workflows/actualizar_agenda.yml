name: Actualizador de Agenda Automático

on:
  schedule:
    # GitHub retrasa y descarta muchas ejecuciones de cron: con */15 en la práctica sólo corría
    # ~1 vez cada 7 horas. Con */10 y más margen de ejecución las corridas son mucho más frecuentes.
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permite actualizar manualmente desde la web de GitHub
  push:
    branches:
      - main
    paths:
      - 'index.js'
      - '.github/workflows/actualizar_agenda.yml'

# Necesario para poder hacer commit del JSON actualizado con el GITHUB_TOKEN del propio workflow.
permissions:
  contents: write

# Si una ejecución anterior sigue trabajando, no lanzar otra en paralelo.
concurrency:
  group: actualizar-agenda
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el repositorio actual
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias (Fetch y Cheerio)
        run: npm install

      - name: Ejecutar el Scraper Inteligente
        run: node index.js

      - name: Subir el archivo JSON actualizado al repositorio
        run: |
          git config --global user.name "Agenda Bot"
          git config --global user.email "bot@agenda.com"
          git add agenda_combinada.json

          if git diff --quiet && git diff --staged --quiet; then
            echo "No hay cambios nuevos en la agenda para subir."
            exit 0
          fi

          git commit -m "Agenda actualizada automáticamente"

          # Reintenta el push por si otro proceso subió cambios en paralelo.
          for intento in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "JSON actualizado subido correctamente."
              exit 0
            fi
            echo "Push falló (intento $intento). Reintentando..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done

          echo "No se pudo subir la agenda tras 3 intentos."
          exit 1

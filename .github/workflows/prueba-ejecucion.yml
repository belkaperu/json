name: prueba-ejecucion (temporal)
on:
  push:
    branches: [arena/ff941121-json]
    paths: ['.github/workflows/prueba-ejecucion.yml']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - name: Ejecutar scraper real
        run: |
          set -o pipefail
          node index.js 2>&1 | tee salida_scraper.txt
      - uses: actions/upload-artifact@v4
        with:
          name: salida
          path: salida_scraper.txt
      - name: Guardar resultado en la rama de prueba
        run: |
          cp agenda_combinada.json prueba_agenda.json
          git config user.name bot; git config user.email bot@agenda.com
          git add salida_scraper.txt prueba_agenda.json
          git commit -m "prueba: salida real del scraper" || exit 0
          git push origin HEAD:arena/ff941121-json
